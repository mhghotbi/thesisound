version = 1

# Model profiles are reusable provider/model pairs. The two Gemini profiles read
# their actual model IDs from THESISOUND_MODEL_FAST and THESISOUND_MODEL_STRONG.

[profiles.gemini_fast]
provider = "gemini"
model_setting = "model_fast"

[profiles.gemini_strong]
provider = "gemini"
model_setting = "model_strong"

# Okian is available as an OpenAI-compatible provider. Grounded stages must stay
# on Gemini (Google Search / URL Context). Requires OKIAN_BASE_URL and
# OKIAN_API_KEY.

[profiles.okian_qwen]
provider = "okian"
model = "qwen3.6-35"

[profiles.okian_gemma]
provider = "okian"
model = "gemma4-31"

[routes]
# Grounded: keep on Gemini
research_brief = "gemini_fast"
glossary = "gemini_strong"
web_source_capture = "gemini_fast"

# Text-only stages: Gemini Fast/Strong as in reference file
document_map = "gemini_fast"
document_map_merge = "gemini_fast"
evidence_extraction = "gemini_fast"
claim_reconciliation = "gemini_strong"
coverage_audit = "gemini_strong"
episode_plan = "okian_gemma"
persian_script_segment = "okian_gemma"
script_verifier = "okian_gemma"
script_reviser = "okian_gemma"
