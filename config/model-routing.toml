version = 1

# Model profiles are reusable provider/model pairs. The two Gemini profiles read
# their actual model IDs from THESISOUND_MODEL_FAST and THESISOUND_MODEL_STRONG.

[profiles.gemini_fast]
provider = "gemini"
model_setting = "model_fast"

[profiles.gemini_strong]
provider = "gemini"
model_setting = "model_strong"

# Independent reviewer. Reads THESISOUND_MODEL_REVIEWER; when that is unset it
# falls back to THESISOUND_MODEL_STRONG, and script_verifier then refuses to run
# rather than let the writer grade its own script.
[profiles.gemini_reviewer]
provider = "gemini"
model_setting = "model_reviewer"

# Okian is available as an OpenAI-compatible provider. Grounded stages must stay
# on Gemini (Google Search / URL Context). Requires OKIAN_BASE_URL and
# OKIAN_API_KEY.

[profiles.okian_qwen]
provider = "okian"
model = "qwen3.6-35"

[profiles.okian_gemma]
provider = "okian"
model = "gemma4-31"

[profiles.okian_gemini_strong]
provider = "okian"
model = "gemini-3.6-flash"

[profiles.okian_gemini_fast]
provider = "okian"
model = "gemini-3.5-flash-lite"

[profiles.okian_luna]
provider = "okian"
model = "gpt-5.6-luna"

[profiles.okian_deepseek_flash]
provider = "okian"
model = "deepseek-v4-flash-latest"

[profiles.okian_deepseek_pro]
provider = "okian"
model = "deepseek-v4-pro"

[routes]
# Grounded: keep on Gemini
research_brief = "gemini_fast"
glossary = "gemini_strong"
web_source_capture = "gemini_fast"

# Text-only stages: Gemini Fast/Strong as in reference file
document_map = "okian_deepseek_flash"
document_map_merge = "okian_deepseek_pro"
evidence_extraction = "okian_deepseek_flash"
evidence_extraction_batch = "okian_deepseek_flash"
claim_reconciliation = "okian_deepseek_pro"
coverage_audit = "okian_deepseek_pro"
episode_plan = "okian_deepseek_pro"
persian_script_segment = "okian_luna"
# Independence from persian_script_segment (audit R6, ModelRouter._require_reviewer_independence)
# comes from this being a distinct Okian profile, not from THESISOUND_MODEL_REVIEWER -- that
# setting only takes effect if a profile here uses model_setting = "model_reviewer". If you ever
# repoint script_verifier at "okian_luna" (or any profile resolving to the same model as the
# writer), the router refuses to resolve the route rather than let the writer grade itself.
script_verifier = "okian_deepseek_pro"
script_reviser = "okian_luna"
