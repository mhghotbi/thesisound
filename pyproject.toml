[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "thesisound"
version = "0.1.0"
description = "Evidence-grounded Persian educational podcast pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "kavenegar>=1.1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "reportlab>=4.2,<5",
  "ruff>=0.9,<1",
]
gemini = [
  "google-genai>=1.0,<2",
]
web = [
  "httpx>=0.28,<1",
]
web-ui = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "itsdangerous>=2.2,<3",
  "httpx>=0.28,<1",
]
parsers = [
  "docling>=2.0,<4",
  "mineru[pipeline]>=2.0,<4",
  # NumPy 2.2+ wheels require x86-64-v2; keep parsers usable on older CPUs/VMs.
  "numpy>=2.0,<2.2",
]

[tool.uv]
constraint-dependencies = [
  "numpy>=2.0,<2.2",
]

[project.scripts]
thesisound = "thesisound.cli_with_audio:app"
thesisound-web = "thesisound.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/thesisound"]
artifacts = [
  "src/thesisound/web/templates/**",
  "src/thesisound/web/static/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: calls external model APIs and is skipped unless explicitly enabled",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/apply_medium_items.py" = ["E501"]
"tests/test_evidence_fanout.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
