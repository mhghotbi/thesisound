name: Apply review fixes v2

on:
  push:
    branches:
      - fix/large-doc-navigation-search
    paths:
      - .github/workflows/apply-review-fixes-v2.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > /tmp/review_fix.py
          python /tmp/review_fix.py
          rm -f .github/workflows/apply-review-fixes.yml
          rm -f .github/workflows/apply-review-fixes-v2.yml
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra web-ui --extra gemini
          uv run ruff format src/thesisound/services/document_mapper.py src/thesisound/web/source_discovery.py tests/test_document_mapper_large_inputs.py
          uv run ruff check . --output-format=github
          uv run pytest
      - name: Commit validated review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require complete large-document coverage and stable web-source identity"
          git push origin HEAD:fix/large-doc-navigation-search
