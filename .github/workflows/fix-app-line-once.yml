name: Fix app line once

on:
  push:
    branches: [agent/ui-refactor-v2]
    paths: [.github/workflows/fix-app-line-once.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ui-refactor-v2
      - name: Split long validation message and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/thesisound/web/app.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          target = "این برداشت اولیه وارد تحلیل منابع شده است و بدون بازگشت به مرحلهٔ قبلی قابل ویرایش نیست."
          changed = False
          output = []
          for line in lines:
              if target in line:
                  indent = line[: len(line) - len(line.lstrip())]
                  output.extend([
                      f'{indent}"این برداشت اولیه وارد تحلیل منابع شده است و بدون بازگشت "',
                      f'{indent}"به مرحلهٔ قبلی قابل ویرایش نیست."',
                  ])
                  changed = True
              else:
                  output.append(line)
          if changed:
              path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY
          git rm .github/workflows/fix-app-line-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/thesisound/web/app.py
          git commit -m "Fix app validation line length"
          git push origin HEAD:agent/ui-refactor-v2
