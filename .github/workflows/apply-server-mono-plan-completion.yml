          )
          PY

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync --extra dev --extra web-ui

      - name: Format changed Python tests
        run: uv run ruff format tests/test_gates.py tests/test_eval_harness.py tests/test_source_analysis.py tests/test_script_run.py tests/test_script_pipeline.py

      - name: Lint
        run: uv run ruff check . --output-format=github

      - name: Validate golden cases without model clients
        run: uv run thesisound eval --dry-run

      - name: Targeted regression tests
        run: uv run pytest tests/test_gates.py tests/test_eval_harness.py tests/test_source_analysis.py tests/test_script_run.py tests/test_script_pipeline.py

      - name: Full test suite
        run: uv run pytest

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/34-production-sop.md tests/test_gates.py tests/test_eval_harness.py tests/test_source_analysis.py tests/test_script_run.py tests/test_script_pipeline.py
          git diff --cached --check
          git commit -m "Complete server-mono items 6-10 verification"
          git push origin HEAD:agent/complete-server-mono-6-10
