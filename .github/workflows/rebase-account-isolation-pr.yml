name: Refresh account isolation PR on main

on:
  push:
    branches:
      - agent/account-isolation-plan-fixes

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Merge current main and resolve the single expected overlap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "src/thesisound/web/app.py" ]; then
              echo "Unexpected conflicts:"
              echo "$conflicts"
              exit 1
            fi
            git checkout --theirs src/thesisound/web/app.py
            python - <<'PY'
          from pathlib import Path

          path = Path("src/thesisound/web/app.py")
          text = path.read_text(encoding="utf-8")
          if "import shutil\n" not in text:
              text = text.replace("import secrets\n", "import secrets\nimport shutil\n", 1)
          old = '''            workspace.save_project(project)\n            accounts.add_project_member(\n                project.project_id,\n                request.state.account.user_id,\n                role="owner",\n            )\n'''
          new = '''            workspace.save_project(project)\n            try:\n                accounts.add_project_member(\n                    project.project_id,\n                    request.state.account.user_id,\n                    role="owner",\n                )\n            except Exception:\n                # Project metadata and membership live in independent stores.\n                # If membership persistence fails, leaving the freshly-created\n                # directory behind creates an invisible orphan and a retry\n                # creates a duplicate. Roll back only this brand-new UUID.\n                shutil.rmtree(workspace.project_dir(project.project_id), ignore_errors=True)\n                raise\n'''
          if old not in text:
              raise SystemExit("project creation anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
            git add src/thesisound/web/app.py
          fi
      - name: Install dependencies
        run: uv sync --extra dev --extra web-ui
      - name: Validate merged result
        run: |
          uv run ruff check . --exclude .github/workflows/rebase-account-isolation-pr.yml --output-format=github
          uv run thesisound models verify --allow-missing
          uv run thesisound eval --dry-run
          uv run pytest
      - name: Commit clean merge result
        run: |
          git restore --worktree --staged workspaces || true
          git clean -fd workspaces || true
          git rm .github/workflows/rebase-account-isolation-pr.yml
          git add -A
          git commit -m "merge: refresh account isolation safeguards on current main"
          git push origin HEAD:agent/account-isolation-plan-fixes
