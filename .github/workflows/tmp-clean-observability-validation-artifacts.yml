name: Temporary observability validation cleanup

on:
  push:
    branches: [agent/align-observability-plan]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/align-observability-plan
          fetch-depth: 0

      - name: Restore workspace artifacts to main
        run: |
          git fetch origin main
          git diff --name-only --diff-filter=A origin/main -- workspaces | while read -r path; do
            [ -n "$path" ] && git rm -f -- "$path"
          done
          git restore --source=origin/main --worktree --staged -- workspaces
          rm .github/workflows/tmp-clean-observability-validation-artifacts.yml

      - name: Verify no workspace drift and publish cleanup
        run: |
          test -z "$(git diff --name-only origin/main -- workspaces)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove observability validation artifacts"
          git push origin HEAD:agent/align-observability-plan
