name: Temporary final observability alignment

on:
  push:
    branches: [agent/align-observability-plan]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/align-observability-plan

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Apply final alignment fixups
        run: python .github/finalize_observability_alignment.py

      - name: Remove temporary helpers
        run: rm .github/finalize_observability_alignment.py .github/workflows/tmp-final-observability-alignment.yml

      - name: Install dependencies
        run: uv sync --extra dev --extra web-ui

      - name: Format and lint changed files
        run: |
          uv run ruff format \
            src/thesisound/observability.py \
            src/thesisound/web/observability_routes.py \
            tests/test_observability.py
          uv run ruff check --fix \
            src/thesisound/observability.py \
            src/thesisound/web/observability_routes.py \
            tests/test_observability.py
          uv run ruff check . --output-format=github

      - name: Focused privacy and phase tests
        run: |
          uv run pytest -q \
            tests/test_observability.py \
            tests/test_logging_setup.py \
            tests/test_observability_rollups.py \
            tests/test_observability_phase56.py

      - name: Publish validated fixups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize observability plan alignment"
          git push origin HEAD:agent/align-observability-plan
