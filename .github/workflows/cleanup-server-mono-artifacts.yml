name: Cleanup server-mono test artifacts

on:
  push:
    branches:
      - codex/server-mono-light-items-1-5
    paths:
      - .github/workflows/cleanup-server-mono-artifacts.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove generated test artifacts and this workflow
        run: |
          git fetch origin main
          git diff --name-only --diff-filter=A origin/main...HEAD -- \
            workspaces/_observability/artifacts \
            workspaces/_accounts/accounts.sqlite3 > /tmp/generated-files
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              git rm -f -- "$file"
            fi
          done < /tmp/generated-files
          git rm .github/workflows/cleanup-server-mono-artifacts.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove generated test artifacts"
          git push
