name: Clean up obsolete branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-obsolete-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Delete merged branch and cleanup workflow
        shell: bash
        run: |
          git push origin --delete fix/large-doc-navigation-search || true
          rm -f .github/workflows/cleanup-obsolete-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove branch cleanup workflow"
          git push origin HEAD:main
