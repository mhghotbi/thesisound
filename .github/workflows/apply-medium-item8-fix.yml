name: Apply corrected evidence fanout

on:
  push:
    branches: [implement-medium-items-6-10]
    paths:
      - .github/workflows/apply-medium-item8-fix.yml
      - scripts/fix_medium_item8.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: implement-medium-items-6-10
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra web-ui

      - name: Apply item 8 and concurrency correction
        run: |
          uv run python scripts/apply_medium_items.py
          uv run python scripts/fix_medium_item8.py

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Archive validated working tree
        if: always()
        run: |
          tar --exclude=.git --exclude=.venv --exclude=working-tree.tgz \
            -czf working-tree.tgz .

      - name: Upload validated working tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medium-item8-working-tree
          path: working-tree.tgz
          retention-days: 2

      - name: Commit validated changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: isolate evidence fanout failures"
          git push origin HEAD:implement-medium-items-6-10
