name: Apply server-mono light items

on:
  push:
    branches:
      - codex/server-mono-light-items-1-5
    paths:
      - .github/scripts/apply_server_mono_light.py
      - .github/scripts/fix_recent_baseline_lint.py
      - .github/workflows/apply-server-mono-light.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip apply]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --extra dev --extra gemini --extra web-ui
      - name: Repair latest baseline lint
        run: uv run python .github/scripts/fix_recent_baseline_lint.py
      - name: Apply current item
        run: uv run python .github/scripts/apply_server_mono_light.py
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest -q
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "feat: implement server-mono light item 1"
          git push
