name: Apply final workflow fixes

on:
  push:
    branches: [fix/large-doc-navigation-search]
    paths:
      - .github/workflows/apply-final-workflow-fixes.yml
      - .github/final-patch/**

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/final-patch/part-* | base64 --decode > /tmp/final_patch.tar.gz
          echo "94ca4527c2a245375bd0dae0261dcd665e75bfe4db65b03c53f22902f7cf3772  /tmp/final_patch.tar.gz" | sha256sum --check -
          tar -xzf /tmp/final_patch.tar.gz -C .
          rm -rf .github/final-patch
          rm -rf .github/workflow-fixes
          rm -rf .github/workflow-fixes-v3
          rm -f .github/workflows/apply-workflow-fixes.yml
          rm -f .github/workflows/apply-final-workflow-fixes.yml
      - name: Install dependencies
        run: uv sync --extra dev --extra web-ui --extra gemini
      - name: Normalize touched Python files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/thesisound/web/source_routes.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("            source = store.remove(source_id)\n", "            store.remove(source_id)\n")
          path.write_text(text, encoding="utf-8")
          PY
          files=(
            src/thesisound/services/document_mapper.py
            src/thesisound/web/source_routes.py
            tests/test_document_mapper_large_inputs.py
            tests/test_web_source_discovery.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check --fix "${files[@]}"
      - name: Lint
        run: uv run ruff check . --output-format=github
      - name: Test
        run: uv run pytest
      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix large source mapping and editable source discovery workflow"
          git push origin HEAD:fix/large-doc-navigation-search
