name: One-shot copy contract correction

on:
  push:
    branches: [agent/ui-refactor-v2]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ui-refactor-v2
      - name: Remove the internal identifier from visible-copy assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_web_simple_copy_contract.py")
          content = path.read_text(encoding="utf-8")
          content = content.replace(
              '("Gemini", "candidate", "quality gate", "quality-gate", "stale")',
              '("Gemini", "quality gate", "quality-gate", "stale")',
          )
          path.write_text(content, encoding="utf-8")
          PY
          git rm .github/workflows/one-shot-copy-contract-fix.yml
      - name: Commit the correction and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_web_simple_copy_contract.py
          git commit -m "Refine simple-copy contract"
          git push origin HEAD:agent/ui-refactor-v2
