name: Apply observability implementation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-observability.yml
      - .github/observability-payload/**

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reconstruct verified payload
        shell: bash
        run: |
          cat .github/observability-payload/part-* > /tmp/observability-payload.b64
          base64 --decode /tmp/observability-payload.b64 > /tmp/observability-payload.tar.gz
          echo "e1f82a98938df2e64c59b8184effec0e60adda439927d0eaff667b1147d5c848  /tmp/observability-payload.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/observability-payload.tar.gz
          rm -rf .github/observability-payload
          rm -f .github/workflows/apply-observability.yml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra web-ui

      - name: Normalize observability imports
        run: uv run ruff check src/thesisound/gemini_key_pool.py --select I --fix

      - name: Lint
        run: uv run ruff check . --output-format=github

      - name: Test
        run: uv run pytest

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add unified model-call observability"
          git push origin HEAD:main
