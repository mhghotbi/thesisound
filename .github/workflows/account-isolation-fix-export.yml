name: Validate account isolation plan fixes

on:
  push:
    branches:
      - agent/account-isolation-plan-fixes

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Apply fixes
        run: python .github/apply-account-isolation-fixes.py
      - name: Install dependencies
        run: uv sync --extra dev --extra web-ui
      - name: Normalize changed Python
        run: |
          uv run ruff check src/thesisound/accounts.py src/thesisound/web/app.py tests/test_accounts_store.py tests/test_web_project_authorization.py --fix
          uv run ruff format src/thesisound/accounts.py src/thesisound/web/app.py tests/test_accounts_store.py tests/test_web_project_authorization.py
      - name: Lint
        run: uv run ruff check . --output-format=github
      - name: Validate OCR lock
        run: uv run thesisound models verify --allow-missing
      - name: Validate golden evaluation cases
        run: uv run thesisound eval --dry-run
      - name: Test
        run: uv run pytest
      - name: Commit validated fixes and remove temporary machinery
        run: |
          rm .github/workflows/account-isolation-fix-export.yml
          rm .github/apply-account-isolation-fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete account isolation plan safeguards"
          git push origin HEAD:agent/account-isolation-plan-fixes
