name: Apply EPUB support

on:
  push:
    branches: [main]
    paths:
      - .github/epub-support.patch.gz.b64
      - .github/workflows/apply-epub-support.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/epub-support.patch.gz.b64 | gzip --decompress > /tmp/epub-support.patch
          set +e
          patch -p1 --forward < /tmp/epub-support.patch
          patch_status=$?
          set -e
          mapfile -t rejects < <(find . -name '*.rej' -print)
          if (( patch_status != 0 )); then
            if (( ${#rejects[@]} != 1 )) || [[ "${rejects[0]}" != "./src/thesisound/adapters/parsers/__init__.py.rej" ]]; then
              printf 'Unexpected patch rejects:\n%s\n' "${rejects[*]:-none}" >&2
              exit 1
            fi
          fi
          rm -f src/thesisound/adapters/parsers/__init__.py.rej
          cat > src/thesisound/adapters/parsers/__init__.py <<'PY'
          """Document parser adapters."""

          from thesisound.adapters.parsers.docling_adapter import DoclingParser
          from thesisound.adapters.parsers.epub_adapter import EpubDocumentParser
          from thesisound.adapters.parsers.native_adapter import NativeDocumentParser

          __all__ = ["DoclingParser", "EpubDocumentParser", "NativeDocumentParser"]
          PY
          rm .github/epub-support.patch.gz.b64
          rm .github/workflows/apply-epub-support.yml
      - name: Commit EPUB support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add EPUB ingestion support"
          git push origin HEAD:main
