name: Apply Okian provider routing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-okian-routing.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Reconstruct and apply repository patch
        run: |
          cat .patch/okian-routing/part-* | python -c 'import base64,lzma,sys; sys.stdout.buffer.write(lzma.decompress(base64.b64decode(sys.stdin.buffer.read())))' > /tmp/apply_okian_routing.py
          test "$(sha256sum /tmp/apply_okian_routing.py | cut -d' ' -f1)" = "d6a4df87328272355a11ab34b87f04195990857b31c04af6f026c1dd886f5ae8"
          python /tmp/apply_okian_routing.py
          rm -rf .patch/okian-routing
          rm .github/workflows/apply-okian-routing.yml

      - name: Install dependencies
        run: uv sync --extra dev --extra web-ui

      - name: Format changed Python
        run: |
          uv run ruff format \
            src/thesisound/config.py \
            src/thesisound/ports.py \
            src/thesisound/model_routing.py \
            src/thesisound/adapters/models/gemini.py \
            src/thesisound/adapters/models/okian.py \
            src/thesisound/services/model_runner.py \
            src/thesisound/services/runtime_preflight.py \
            tests/test_model_routing.py \
            tests/test_okian_adapter.py

      - name: Lint
        run: |
          uv run ruff check . --fix
          uv run ruff check . --output-format=github

      - name: Test
        run: uv run pytest

      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add inactive Okian provider and stage model routing"
          git push origin HEAD:main
