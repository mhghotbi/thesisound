name: Temporary observability plan alignment

on:
  push:
    branches: [agent/align-observability-plan]

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/align-observability-plan

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Normalize temporary patcher
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/align_observability_plan.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(OBS, "        error_message=row[16],", "        error_message=redact_exception_message(row[16]),")
          # The span row has another error_message at index 16; replace the remaining occurrence.
          replace_once(OBS, "        error_message=row[16],", "        error_message=redact_exception_message(row[16]),")'''
          new = '''replace_all(
              OBS,
              "        error_message=row[16],",
              "        error_message=redact_exception_message(row[16]),",
              expected=2,
          )'''
          if text.count(old) != 1:
              raise SystemExit('temporary error-message patcher guard did not match exactly once')
          text = text.replace(old, new, 1)

          marker = '''# Ensure the old rollup API is gone from the ledger and all source callers use
          # the dedicated service.'''
          addition = '''EVAL_HARNESS = "src/thesisound/services/eval_harness.py"
          replace_once(
              EVAL_HARNESS,
              "from thesisound.observability import ObservabilityLedger, tracer_from_settings\\n",
              "from thesisound.observability import ObservabilityLedger, tracer_from_settings\\nfrom thesisound.services.observability_rollup import ObservabilityRollup\\n",
          )
          replace_once(
              EVAL_HARNESS,
              "    usage = ledger.project_summary(project.project_id)\\n",
              "    usage = ObservabilityRollup(ledger).project_summary(project.project_id)\\n",
          )

          '''
          if text.count(marker) != 1:
              raise SystemExit('rollup caller insertion marker did not match exactly once')
          text = text.replace(marker, addition + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply precise plan corrections
        run: python .github/align_observability_plan.py

      - name: Install dependencies
        run: uv sync --extra dev --extra web-ui

      - name: Format changed Python files
        run: |
          uv run ruff format \
            src/thesisound/observability.py \
            src/thesisound/logging_setup.py \
            src/thesisound/observability_cli.py \
            src/thesisound/services/eval_harness.py \
            src/thesisound/services/observability_reporting.py \
            src/thesisound/services/observability_rollup.py \
            src/thesisound/web/app.py \
            src/thesisound/web/observability_routes.py \
            tests/test_observability.py \
            tests/test_logging_setup.py \
            tests/test_observability_rollups.py \
            tests/test_observability_phase56.py

      - name: Lint
        run: uv run ruff check . --output-format=github

      - name: Focused observability tests
        run: |
          uv run pytest -q \
            tests/test_observability.py \
            tests/test_observability_rollups.py \
            tests/test_logging_setup.py \
            tests/test_observability_phase56.py \
            tests/test_tracing.py \
            tests/test_tracing_propagation.py

      - name: Validate OCR lock without downloading models
        run: uv run thesisound models verify --allow-missing

      - name: Validate golden evaluation cases
        run: uv run thesisound eval --dry-run

      - name: Doctor
        run: uv run thesisound doctor

      - name: Full test suite
        run: uv run pytest

      - name: Remove temporary executor and publish corrections
        run: |
          rm .github/align_observability_plan.py .github/workflows/tmp-observability-plan-align.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Align observability with original plan"
          git push origin HEAD:agent/align-observability-plan
