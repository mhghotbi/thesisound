name: Apply final medium adoption items

on:
  push:
    branches: [implement-medium-items-6-10]
    paths:
      - .automation/medium-items.patch.gz.b64.*
      - .automation/post_format_fix.py
      - .github/workflows/apply-final-medium-items.yml

permissions:
  contents: write

jobs:
  apply-format-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: implement-medium-items-6-10
          fetch-depth: 0

      - name: Reconstruct and verify complete implementation patch
        shell: bash
        run: |
          cat .automation/medium-items.patch.gz.b64.* | base64 -d > /tmp/medium-items.patch.gz
          echo "7b9387af9da26d31341ec3eda311390b157baef50b4c4fdef35847826967f486  /tmp/medium-items.patch.gz" | sha256sum -c -
          gzip -dc /tmp/medium-items.patch.gz | git apply --binary --index

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra web-ui

      - name: Format and fix changed Python files
        shell: bash
        run: |
          mapfile -t py_files < <(git diff --name-only --diff-filter=ACMR HEAD -- '*.py')
          if ((${#py_files[@]})); then
            uv run ruff format "${py_files[@]}"
            uv run python .automation/post_format_fix.py
            uv run ruff format "${py_files[@]}"
            rm .automation/post_format_fix.py
            uv run ruff check "${py_files[@]}" --fix
          fi

      - name: Lint entire repository
        run: uv run ruff check . --output-format=github

      - name: Validate OCR lock without downloading models
        run: uv run thesisound models verify --allow-missing

      - name: Validate frozen eval cases without model construction
        run: uv run thesisound eval --dry-run

      - name: Run complete test suite
        run: uv run pytest -q

      - name: Prepare code-only commit
        if: success()
        run: |
          git restore --source=HEAD -- .github/workflows .automation workspaces
          git clean -fd -- workspaces

      - name: Commit validated implementation
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement server-mono medium adoption items"
          git push origin HEAD:implement-medium-items-6-10

      - name: Archive failed working tree
        if: failure()
        run: tar --exclude=.git --exclude=.venv -czf /tmp/failed-medium-tree.tgz .

      - name: Upload failed working tree
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-medium-tree-${{ github.run_number }}
          path: /tmp/failed-medium-tree.tgz
          retention-days: 2
