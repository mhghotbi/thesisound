name: Apply review fixes v4

on:
  push:
    branches:
      - fix/large-doc-navigation-search
    paths:
      - .github/workflows/apply-review-fixes-v4.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Apply corrected review patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import re
          from pathlib import Path

          workflow = Path(".github/workflows/apply-review-fixes-v2.yml").read_text(
              encoding="utf-8"
          )
          match = re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64", workflow)
          if match is None:
              raise SystemExit("review patch payload not found")
          Path("/tmp/review_fix.py").write_bytes(base64.b64decode(match.group(1)))
          PY
          python /tmp/review_fix.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_document_mapper_large_inputs.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "        OmittingPartitionRunner(),\n"
              "        maximum_input_characters=500,\n"
          )
          new = (
              "        OmittingPartitionRunner(),\n"
              "        maximum_input_characters=700,\n"
          )
          if old not in text:
              raise SystemExit("strict-coverage test budget marker not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm -f .github/workflows/apply-review-fixes.yml
          rm -f .github/workflows/apply-review-fixes-v2.yml
          rm -f .github/workflows/apply-review-fixes-v3.yml
          rm -f .github/workflows/apply-review-fixes-v4.yml
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra web-ui --extra gemini
          uv run ruff format \
            src/thesisound/services/document_mapper.py \
            src/thesisound/web/source_discovery.py \
            tests/test_document_mapper_large_inputs.py
          uv run ruff check . --output-format=github
          uv run pytest
      - name: Commit validated review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require complete large-document coverage and stable web-source identity"
          git push origin HEAD:fix/large-doc-navigation-search
