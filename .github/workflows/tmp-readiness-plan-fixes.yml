name: Temporary readiness plan fixes

on:
  push:
    branches: [agent/readiness-plan-fixes]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/readiness-plan-fixes

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Apply focused readiness fixes
        run: python .github/tmp_apply_readiness_fixes.py

      - name: Install dependencies
        run: uv sync --extra dev --extra web-ui --extra gemini

      - name: Format and lint
        run: |
          uv run ruff format src/thesisound/services/readiness.py tests/test_readiness.py
          uv run ruff check --fix src/thesisound/services/readiness.py tests/test_readiness.py
          uv run ruff check . --output-format=github

      - name: Focused readiness tests
        run: uv run pytest -q tests/test_readiness.py tests/test_cli_safety.py

      - name: Full test suite
        run: uv run pytest

      - name: Publish validated corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/tmp_apply_readiness_fixes.py .github/workflows/tmp-readiness-plan-fixes.yml
          git add src/thesisound/services/readiness.py tests/test_readiness.py
          git diff --cached --check
          git commit -m "Fix readiness plan verification gaps"
          git push origin HEAD:agent/readiness-plan-fixes
