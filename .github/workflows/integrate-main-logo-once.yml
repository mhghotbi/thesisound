name: Integrate main logo once

on:
  push:
    branches: [agent/ui-refactor-v2]
    paths: [.github/workflows/integrate-main-logo-once.yml]

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ui-refactor-v2
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Merge current main and integrate the Maqaal logo
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-ff -X ours origin/main -m "Merge current main into UI refactor"
          python - <<'PY'
          from pathlib import Path

          base = Path("src/thesisound/web/templates/base.html")
          text = base.read_text(encoding="utf-8")
          text = text.replace(
              "  <title>{% block title %}مقال{% endblock %}</title>\n  <script>",
              "  <title>{% block title %}مقال{% endblock %}</title>\n"
              "  <link rel=\"icon\" type=\"image/webp\" href=\"{{ url_for('static', path='/maghal-logo-mark.webp') }}\">\n"
              "  <script>",
              1,
          )
          text = text.replace(
              """        <span class="brand__mark" aria-hidden="true">م</span>
        <span>
          <strong>مقال</strong>
          <small>مطالعه‌ای که شنیده می‌شود</small>
        </span>""",
              """        <img class="brand__logo" src="{{ url_for('static', path='/maghal-logo-mark.webp') }}" alt="" width="128" height="128">
        <span class="brand__identity">
          <strong>مقال</strong>
          <small>مطالعه‌ای که شنیده می‌شود</small>
        </span>""",
              1,
          )
          base.write_text(text, encoding="utf-8")

          for filename in ("auth/login.html", "auth/verify.html"):
              path = Path("src/thesisound/web/templates") / filename
              text = path.read_text(encoding="utf-8")
              old = """  <div class="brand">
    <span class="brand__mark" aria-hidden="true">م</span>
    <span><strong>مقال</strong><small>مطالعه‌ای که شنیده می‌شود</small></span>
  </div>"""
              new = """  <div class="brand brand--auth">
    <img class="auth-brand__logo" src="{{ url_for('static', path='/maghal-logo-full.webp') }}" alt="مقال؛ گفتار مستند شنیدنی" width="497" height="520">
  </div>"""
              if old not in text:
                  raise SystemExit(f"auth brand target missing in {filename}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          css = Path("src/thesisound/web/static/app.css")
          text = css.read_text(encoding="utf-8")
          old = """.brand__mark {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border: 1px solid var(--brand-soft);
  border-radius: 50%;
  font: 800 13px/1 ui-monospace, monospace;
}"""
          new = """.brand__logo {
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  border-radius: 8px;
  object-fit: cover;
}
.brand__identity { display: block; }"""
          if old not in text:
              raise SystemExit("brand mark CSS target missing")
          text = text.replace(old, new, 1)
          text = text.replace(
              ".auth-story .brand { width: fit-content; }",
              ".auth-story .brand { width: fit-content; }\n"
              ".brand--auth { display: block; }\n"
              ".auth-brand__logo { display: block; width: min(190px, 72%); height: auto; border-radius: 12px; }",
              1,
          )
          css.write_text(text, encoding="utf-8")
          PY

      - name: Verify code and contracts
        run: |
          uv sync --extra dev --extra web-ui
          uv run ruff check .
          uv run thesisound models verify --allow-missing
          uv run pytest

      - name: Run visual QA on merged product code
        run: |
          git show ec46201ee15bf2f80fcebf9af20e1f6674c4f84e:scripts/ui_visual_qa.py > scripts/ui_visual_qa.py
          sed -i 's/otp_resend_cooldown_seconds=1/otp_resend_cooldown_seconds=5/' scripts/ui_visual_qa.py
          sed -i 's/speaker_dynamic="analysis"/speaker_dynamic="critique"/' scripts/ui_visual_qa.py
          sed -i 's/speaker_dynamic="synthesis"/speaker_dynamic="recap"/' scripts/ui_visual_qa.py
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ui_visual_qa.py")
          content = path.read_text(encoding="utf-8")
          content = content.replace(
              "        await page.click('[data-theme-value=\"wood\"]')",
              "        await page.click(\".theme-switcher > summary\")\n"
              "        await page.click('[data-theme-value=\"wood\"]')",
          )
          content = content.replace(
              '                    await page.evaluate("document.fonts.ready")',
              '                    await page.evaluate("document.fonts.ready")\n'
              '                    await page.wait_for_timeout(200)',
          )
          content = content.replace(
              '            await mobile.evaluate("document.fonts.ready")',
              '            await mobile.evaluate("document.fonts.ready")\n'
              '            await mobile.wait_for_timeout(200)',
          )
          content = content.replace(
              '            await page.evaluate("document.fonts.ready")\n'
              '            for index in range(source_count):',
              '            await page.evaluate("document.fonts.ready")\n'
              '            await page.wait_for_timeout(200)\n'
              '            for index in range(source_count):',
          )
          path.write_text(content, encoding="utf-8")
          PY
          uv pip install playwright pillow
          uv run playwright install --with-deps chromium
          uv run python scripts/ui_visual_qa.py prepare --output /tmp/ui-visual-qa
          uv run python -m http.server 8765 --directory /tmp/ui-visual-qa >/tmp/ui-visual-qa-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/pages.json >/dev/null; then break; fi
            sleep 1
          done
          uv run python scripts/ui_visual_qa.py capture --output /tmp/ui-visual-qa --base-url http://127.0.0.1:8765
          rm scripts/ui_visual_qa.py

      - name: Commit verified integration and remove this workflow
        run: |
          git rm .github/workflows/integrate-main-logo-once.yml
          git add src/thesisound/web
          git commit -m "Integrate Maqaal logo with redesigned UI"
          git push origin HEAD:agent/ui-refactor-v2
