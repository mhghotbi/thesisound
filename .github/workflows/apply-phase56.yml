name: Apply observability phases 5 and 6

on:
  push:
    branches: [codex/observability-phases-5-6]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply deterministic patch
        run: |
          cat tools/apply_phase56.part* | base64 --decode | gzip --decompress > tools/apply_phase56.py
          python tools/apply_phase56.py
          python - <<'PY'
          from pathlib import Path

          path = Path("src/thesisound/observability_cli.py")
          content = path.read_text(encoding="utf-8")
          for needle in (
              "out: Path = typer.Option(",
              "run_a: UUID | None = typer.Argument(",
              "run_b: UUID | None = typer.Argument(",
          ):
              content = content.replace(needle, f"{needle}  # noqa: B008", 1)
          path.write_text(content, encoding="utf-8")
          PY

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra web-ui

      - name: Format and lint changed Python files
        run: |
          FILES=(
            src/thesisound/tracing.py
            src/thesisound/observability_cli.py
            src/thesisound/services/observability_reporting.py
            src/thesisound/web/app.py
            src/thesisound/web/observability_routes.py
            tests/test_observability_phase56.py
          )
          uv run ruff check --fix "${FILES[@]}"
          uv run ruff format "${FILES[@]}"
          uv run ruff check "${FILES[@]}"

      - name: Run phase tests
        run: uv run pytest tests/test_observability_phase56.py

      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement observability export and operator view"
          git push origin HEAD:${GITHUB_REF_NAME}
