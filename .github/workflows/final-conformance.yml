name: Validate final conformance fixes

on:
  push:
    branches:
      - codex/server-mono-light-items-1-5
    paths:
      - .github/scripts/final_conformance_fixes.py
      - .github/workflows/final-conformance.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: uv sync --extra dev --extra gemini --extra web-ui
      - name: Apply conformance fixes
        run: uv run python .github/scripts/final_conformance_fixes.py
      - name: Lint
        run: uv run ruff check src tests
      - name: Validate OCR lock
        run: uv run thesisound models verify --allow-missing
      - name: Test
        run: uv run pytest -q
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/thesisound/observability.py \
            src/thesisound/services/url_probe.py \
            tests/test_pipeline_runs.py \
            tests/test_url_probe.py
          git commit -m "fix: close final observability and probe edge cases"
          git push
