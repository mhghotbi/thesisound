name: One-shot final UI verification

on:
  push:
    branches: [agent/ui-refactor-v2]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/ui-refactor-v2
          fetch-depth: 0

      - name: Wait for the copy-contract correction
        run: |
          for attempt in {1..60}; do
            git fetch origin agent/ui-refactor-v2
            if ! git cat-file -e origin/agent/ui-refactor-v2:.github/workflows/one-shot-copy-contract-fix.yml 2>/dev/null; then
              git reset --hard origin/agent/ui-refactor-v2
              exit 0
            fi
            sleep 2
          done
          echo "The copy-contract correction did not finish in time."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install application and browser QA tools
        run: |
          uv sync --extra dev --extra web-ui
          uv pip install playwright pillow
          uv run playwright install --with-deps chromium

      - name: Run static and behavioral verification
        run: |
          uv run ruff check .
          uv run thesisound models verify --allow-missing
          uv run pytest

      - name: Prepare real rendered pages
        run: |
          sed -i 's/otp_resend_cooldown_seconds=1/otp_resend_cooldown_seconds=5/' scripts/ui_visual_qa.py
          sed -i 's/speaker_dynamic="analysis"/speaker_dynamic="critique"/' scripts/ui_visual_qa.py
          sed -i 's/speaker_dynamic="synthesis"/speaker_dynamic="recap"/' scripts/ui_visual_qa.py
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ui_visual_qa.py")
          content = path.read_text(encoding="utf-8")
          content = content.replace(
              "        await page.click('[data-theme-value=\"wood\"]')",
              "        await page.click(\".theme-switcher > summary\")\n"
              "        await page.click('[data-theme-value=\"wood\"]')",
          )
          content = content.replace(
              '                    await page.evaluate("document.fonts.ready")',
              '                    await page.evaluate("document.fonts.ready")\n'
              '                    await page.wait_for_timeout(200)',
          )
          content = content.replace(
              '            await mobile.evaluate("document.fonts.ready")',
              '            await mobile.evaluate("document.fonts.ready")\n'
              '            await mobile.wait_for_timeout(200)',
          )
          content = content.replace(
              '            await page.evaluate("document.fonts.ready")\n'
              '            for index in range(source_count):',
              '            await page.evaluate("document.fonts.ready")\n'
              '            await page.wait_for_timeout(200)\n'
              '            for index in range(source_count):',
          )
          path.write_text(content, encoding="utf-8")
          PY
          uv run python scripts/ui_visual_qa.py prepare --output /tmp/ui-visual-qa

      - name: Start QA server with preference persistence stub
        run: |
          cat >/tmp/ui_qa_server.py <<'PY'
          import os
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer

          os.chdir("/tmp/ui-visual-qa")

          class Handler(SimpleHTTPRequestHandler):
              def do_POST(self):
                  if self.path == "/ui/preferences":
                      self.send_response(204)
                      self.end_headers()
                      return
                  self.send_error(404)

          ThreadingHTTPServer(("127.0.0.1", 8765), Handler).serve_forever()
          PY
          python /tmp/ui_qa_server.py >/tmp/ui-visual-qa-server.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8765/pages.json >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ui-visual-qa-server.log
          exit 1

      - name: Capture all themes modes states and mobile pages
        run: >-
          uv run python scripts/ui_visual_qa.py capture
          --output /tmp/ui-visual-qa
          --base-url http://127.0.0.1:8765

      - name: Verify steady-state visuals and visible copy
        run: |
          cat >/tmp/verify_ui.py <<'PY'
          import asyncio
          import json
          import re
          from pathlib import Path

          from playwright.async_api import async_playwright

          ROOT = "http://127.0.0.1:8765"
          PAGES = json.loads(Path("/tmp/ui-visual-qa/pages.json").read_text())["pages"]
          EXPECTED_COLORS = {
              "cobalt": "rgb(29, 66, 104)",
              "wood": "rgb(125, 74, 38)",
              "olive": "rgb(90, 97, 64)",
          }
          FORBIDDEN_SIMPLE_COPY = (
              "introductory",
              "Verifier مستقل",
              "corpus ناکافی",
              "artifact",
              "candidate",
              "quality-gate",
              "snippet",
              "ETA",
              "ASR",
              "Similarity",
              "Verdict",
              "Gemini",
          )

          async def main():
              manifest = json.loads(
                  Path("/tmp/ui-visual-qa/output/manifest.json").read_text()
              )
              assert manifest["implementation_pages"] == PAGES
              assert manifest["themes"] == ["cobalt", "wood", "olive"]
              assert manifest["modes"] == ["simple", "operator"]
              assert manifest["interaction"] == {"theme": "wood", "mode": "operator"}
              assert manifest["console_events"] == [], manifest["console_events"]

              async with async_playwright() as playwright:
                  browser = await playwright.chromium.launch()
                  page = await browser.new_page(viewport={"width": 1440, "height": 1000})
                  await page.goto(f"{ROOT}/implementation/projects-empty.html", wait_until="networkidle")
                  for theme, expected in EXPECTED_COLORS.items():
                      await page.evaluate(
                          "theme => document.documentElement.dataset.theme = theme",
                          theme,
                      )
                      await page.wait_for_timeout(200)
                      color = await page.locator(".button--primary").first.evaluate(
                          "node => getComputedStyle(node).backgroundColor"
                      )
                      assert color == expected, (theme, color, expected)

                  for name in PAGES:
                      await page.goto(
                          f"{ROOT}/implementation/{name}.html",
                          wait_until="networkidle",
                      )
                      await page.evaluate(
                          """() => {
                              document.documentElement.dataset.theme = 'cobalt';
                              document.documentElement.dataset.mode = 'simple';
                          }"""
                      )
                      await page.wait_for_timeout(200)
                      overflow = await page.evaluate(
                          "document.documentElement.scrollWidth - document.documentElement.clientWidth"
                      )
                      assert overflow <= 1, (name, "desktop", overflow)
                      if name != "system-check":
                          visible_text = await page.locator("body").inner_text()
                          for term in FORBIDDEN_SIMPLE_COPY:
                              assert term.lower() not in visible_text.lower(), (name, term)

                  await page.set_viewport_size({"width": 390, "height": 844})
                  for name in PAGES:
                      await page.goto(
                          f"{ROOT}/implementation/{name}.html",
                          wait_until="networkidle",
                      )
                      await page.evaluate(
                          """() => {
                              document.documentElement.dataset.theme = 'cobalt';
                              document.documentElement.dataset.mode = 'simple';
                          }"""
                      )
                      await page.wait_for_timeout(200)
                      overflow = await page.evaluate(
                          "document.documentElement.scrollWidth - document.documentElement.clientWidth"
                      )
                      assert overflow <= 1, (name, "mobile", overflow)

                  await page.goto(
                      f"{ROOT}/implementation/sources.html",
                      wait_until="networkidle",
                  )
                  file_input = page.locator('input[type="file"]')
                  assert await file_input.get_attribute("aria-label") == "انتخاب فایل منبع"
                  box = await file_input.bounding_box()
                  assert box is not None and box["width"] <= 1 and box["height"] <= 1
                  await browser.close()

          asyncio.run(main())
          PY
          uv run python /tmp/verify_ui.py

      - name: Write final design QA record
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          cat >design-qa.md <<EOF
          # Thesisound UI Design QA

          result: passed

          ## Scope

          - Source target: `docs/ui-refactor/Thesisound UI v2.dc.html`
          - Product routes: login, OTP, project list/empty state, new project, brief, project overview, sources, processing, episode planning, script, audio, and system check
          - Themes: Cobalt, Burnt Wood, Olive
          - Modes: simple and advanced/operator
          - Responsive viewport checks: 1440×1000 and 390×844 at DPR 1

          ## Verification

          - GitHub Actions run: `${RUN_ID}`
          - Reviewed branch head: `${HEAD_SHA}`
          - Ruff, OCR lock validation, and the complete pytest suite passed.
          - Every Jinja template compiled and the real FastAPI routes rendered with domain fixtures.
          - 13 implementation pages were captured in all three themes and both modes; all 13 were also captured at mobile width.
          - Eight source-artifact screens were captured in every theme for comparison.
          - Cobalt is the default; steady-state primary colors were verified as `#1d4268`, `#7d4a26`, and `#5a6140` without cross-theme leakage.
          - Theme and mode controls were exercised through visible controls and produced `wood/operator`.
          - No body-level horizontal overflow was present at either viewport.
          - Simple mode exposed none of the guarded operational terms; technical vocabulary remained operator-only.
          - The custom file picker remained keyboard/screen-reader accessible while native English browser copy was visually hidden.
          - Console and page-error collection was empty.

          ## Findings resolved during QA

          - Added the missing Project Overview and unified the six-step workflow rail.
          - Preserved legacy behavioral contracts while moving technical copy to operator mode.
          - Fixed server-side preservation of brief form values after validation errors.
          - Corrected raw prior-knowledge values and other technical English in simple mode.
          - Confirmed an apparent cross-theme color issue was a screenshot taken mid-transition; recaptured after transition settlement and verified computed colors.
          - Corrected the new-project rail shell and verified mobile layout.

          ## Open findings

          None at P0, P1, or P2.
          EOF

      - name: Upload final visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: thesisound-ui-final-design-qa
          path: /tmp/ui-visual-qa/output
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary implementation files and commit verified result
        run: |
          git fetch origin agent/ui-refactor-v2
          git rebase origin/agent/ui-refactor-v2
          git rm -f --ignore-unmatch \
            docs/ui-refactor/IMPLEMENTATION-PLAN.tmp.md \
            scripts/ui_visual_qa.py \
            .github/workflows/ui-visual-qa.yml \
            .github/workflows/one-shot-copy-contract-fix.yml \
            .github/workflows/one-shot-finalize-ui.yml
          git add design-qa.md tests/test_web_simple_copy_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize verified UI refactor"
          git push origin HEAD:agent/ui-refactor-v2
