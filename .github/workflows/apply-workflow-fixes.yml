name: Apply workflow fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-workflow-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/workflow-fixes/chunk-*.txt | base64 --decode | gzip --decompress > /tmp/apply_workflow_fixes.py
          python /tmp/apply_workflow_fixes.py
          rm -rf .github/workflow-fixes
          rm .github/workflows/apply-workflow-fixes.yml
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra web-ui --extra gemini
          uv run ruff check .
          uv run pytest -q
      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix large-source workflow and add Gemini source discovery UI"
          git push origin HEAD:main
