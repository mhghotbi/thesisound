name: Phase 5-6 focused validation

on:
  push:
    branches: [codex/observability-phases-5-6]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra web-ui
      - run: uv run thesisound models verify --allow-missing
      - run: uv run ruff check src/thesisound/config.py src/thesisound/tracing.py src/thesisound/observability_cli.py src/thesisound/services/observability_reporting.py src/thesisound/web/app.py src/thesisound/web/observability_routes.py tests/test_observability_phase56.py
      - run: uv run pytest tests/test_observability_phase56.py tests/test_ui_language_contract.py
