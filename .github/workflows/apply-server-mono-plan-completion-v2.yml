name: Apply server-mono plan completion fixes v2

on:
  push:
    branches:
      - agent/complete-server-mono-6-10

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-server-mono-6-10
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Reapply remaining original-plan patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-server-mono-plan-completion.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply remaining original-plan fixes\n'
          section = source.index(marker)
          run_marker = '        run: |\n'
          start = source.index(run_marker, section) + len(run_marker)
          end = source.index('\n      - name: Install system dependencies', start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-original-plan.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-original-plan.sh

      - name: Fix deterministic rejection state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/thesisound/services/script_pipeline_service.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if project.state not in {
            ProjectState.FAILED_RETRYABLE,
            ProjectState.SCRIPT_READY,
        }:
            mark_failed(project, message)
        else:
            # SCRIPT_READY cannot transition directly to FAILED_RETRYABLE. Preserve
            # the original pipeline error instead of masking it with a transition
            # error; a resumed run can restore drafting from SCRIPT_READY.
            project.last_error = message
            project.updated_at = datetime.now(UTC)
'''
          new = '''        if project.state == ProjectState.SCRIPT_READY:
            # SCRIPT_READY cannot transition directly to FAILED_RETRYABLE. Move
            # through the existing retryable drafting state so deterministic
            # rejection still uses the normal failure contract.
            transition(project, ProjectState.SCRIPT_DRAFTING)
        if project.state != ProjectState.FAILED_RETRYABLE:
            mark_failed(project, message)
        else:
            project.last_error = message
            project.updated_at = datetime.now(UTC)
'''
          if old not in text:
              raise SystemExit('expected _mark_failed block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync --extra dev --extra web-ui

      - name: Format changed Python
        run: uv run ruff format src/thesisound/services/script_pipeline_service.py tests/test_gates.py tests/test_eval_harness.py tests/test_source_analysis.py tests/test_script_run.py tests/test_script_pipeline.py

      - name: Lint
        run: uv run ruff check . --output-format=github

      - name: Validate OCR lock
        run: uv run thesisound models verify --allow-missing

      - name: Validate golden cases without model clients
        run: uv run thesisound eval --dry-run

      - name: Targeted regression tests
        run: uv run pytest tests/test_gates.py tests/test_eval_harness.py tests/test_source_analysis.py tests/test_script_run.py tests/test_script_pipeline.py

      - name: Full test suite
        run: uv run pytest

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/thesisound/services/script_pipeline_service.py docs/34-production-sop.md tests/test_gates.py tests/test_eval_harness.py tests/test_source_analysis.py tests/test_script_run.py tests/test_script_pipeline.py
          git diff --cached --check
          git commit -m "Complete server-mono items 6-10 verification"
          git push origin HEAD:agent/complete-server-mono-6-10
