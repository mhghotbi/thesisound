name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate Ruff autofix patch
        run: |
          uv run ruff check . --fix
          git diff -- src tests > ruff-fixes.patch

      - name: Upload Ruff autofix patch
        uses: actions/upload-artifact@v4
        with:
          name: ruff-fixes
          path: ruff-fixes.patch

      - name: Verify clean lint state
        run: git diff --exit-code -- src tests

      - name: Test
        run: uv run pytest
