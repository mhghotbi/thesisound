name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra web-ui

      - name: Lint
        run: uv run ruff check . --output-format=github

      - name: Validate OCR lock without downloading models
        run: uv run thesisound models verify --allow-missing

      - name: Validate golden evaluation cases
        run: uv run thesisound eval --dry-run

      - name: Test
        run: uv run pytest
