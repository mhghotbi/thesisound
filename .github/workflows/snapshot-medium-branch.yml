name: Snapshot validated medium branch

on:
  push:
    branches: [implement-medium-items-6-10]
    paths:
      - src/**
      - tests/**

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: implement-medium-items-6-10
          fetch-depth: 0

      - name: Archive source tree
        run: |
          tar --exclude=.git --exclude=.venv --exclude=working-tree.tgz \
            -czf working-tree.tgz .

      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: medium-branch-working-tree
          path: working-tree.tgz
          retention-days: 2
