name: Capture current medium branch

on:
  push:
    branches: [implement-medium-items-6-10]
    paths:
      - .github/workflows/snapshot-current-medium.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: implement-medium-items-6-10
          fetch-depth: 0

      - name: Archive checkout
        run: |
          tar --exclude=.git --exclude=.venv -czf /tmp/current-medium.tgz .

      - name: Upload checkout
        uses: actions/upload-artifact@v4
        with:
          name: current-medium-branch
          path: /tmp/current-medium.tgz
          retention-days: 2
