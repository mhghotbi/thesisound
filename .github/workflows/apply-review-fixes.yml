name: Apply review fixes

on:
  push:
    branches: [implement-medium-items-6-10]
    paths:
      - .github/workflows/apply-review-fixes.yml
      - .automation/review-fixes.patch.gz.b64

permissions:
  contents: write

jobs:
  apply-verify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v6
        with:
          ref: implement-medium-items-6-10
          fetch-depth: 0

      - name: Apply reviewed corrections
        shell: bash
        run: |
          base64 -d .automation/review-fixes.patch.gz.b64 > /tmp/review-fixes.patch.gz
          echo "ad2a1c5fae1ee7548df32bfb17a1c75dcbdb51dbe52e73a5a73defc31da7fdb4  /tmp/review-fixes.patch.gz" | sha256sum -c -
          gzip -dc /tmp/review-fixes.patch.gz | git apply --check
          gzip -dc /tmp/review-fixes.patch.gz | git apply

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra web-ui

      - name: Format and lint
        run: |
          uv run ruff format src/thesisound/services/readiness.py src/thesisound/services/eval_harness.py tests/test_readiness.py tests/test_eval_harness.py
          uv run ruff check . --output-format=github

      - name: Validate OCR lock
        run: uv run thesisound models verify --allow-missing

      - name: Validate golden cases without model construction
        run: uv run thesisound eval --dry-run

      - name: Run complete test suite
        run: uv run pytest -q

      - name: Publish reviewed corrections
        run: |
          rm -f .automation/review-fixes.patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/thesisound/services/readiness.py src/thesisound/services/eval_harness.py tests/test_readiness.py tests/test_eval_harness.py .automation/review-fixes.patch.gz.b64
          git commit -m "fix: close readiness and evaluation review gaps"
          git push origin HEAD:implement-medium-items-6-10
