name: Temporary readiness evidence gate review

on:
  push:
    branches: [agent/readiness-plan-fixes]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/readiness-plan-fixes
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Apply gate-local evidence correction
        run: python .github/tmp_separate_readiness_evidence_gates.py
      - name: Install dependencies
        run: uv sync --extra dev --extra web-ui --extra gemini
      - name: Format and lint product changes
        run: |
          uv run ruff format src/thesisound/services/readiness.py tests/test_readiness.py
          uv run ruff check --fix src/thesisound/services/readiness.py tests/test_readiness.py
          uv run ruff check . --exclude .github/tmp_separate_readiness_evidence_gates.py --output-format=github
      - name: Focused readiness tests
        run: uv run pytest -q tests/test_readiness.py tests/test_cli_safety.py
      - name: Publish reviewed correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/tmp_separate_readiness_evidence_gates.py .github/workflows/tmp-readiness-evidence-gates.yml
          git add src/thesisound/services/readiness.py tests/test_readiness.py
          git diff --cached --check
          git commit -m "Keep readiness evidence failures gate-local"
          git push origin HEAD:agent/readiness-plan-fixes
