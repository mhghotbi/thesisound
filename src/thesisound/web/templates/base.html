<!doctype html>
<html lang="fa" dir="rtl" data-theme="{{ ui_theme or 'olive' }}" data-mode="{{ ui_mode or 'simple' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#5a6140">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}مقال{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='/favicon.ico') }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='/favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='/apple-touch-icon.png') }}">
  <script>
    (() => {
      const themes = new Set(["cobalt", "wood", "olive", "slate"]);
      const modes = new Set(["simple", "operator"]);
      try {
        const theme = localStorage.getItem("maqaal-theme") || localStorage.getItem("thesisound-theme");
        const mode = localStorage.getItem("maqaal-mode") || localStorage.getItem("thesisound-mode");
        document.documentElement.dataset.theme = themes.has(theme) ? theme : "{{ ui_theme or 'olive' }}";
        document.documentElement.dataset.mode = modes.has(mode) ? mode : "{{ ui_mode or 'simple' }}";
      } catch (_) {
        document.documentElement.dataset.theme = "{{ ui_theme or 'olive' }}";
        document.documentElement.dataset.mode = "{{ ui_mode or 'simple' }}";
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=vazirmatn:300,400,500,600,700,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/logo.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">رفتن به محتوای اصلی</a>
  {% if current_user %}
  <header class="app-header">
    <div class="shell app-header__inner">
      <a class="brand" href="/projects" aria-label="خانهٔ مقال">
        <img class="brand__logo" src="{{ url_for('static', path='/maghal-logo-mark.webp') }}" alt="" width="256" height="256">
        <span class="brand__identity">
          <strong>مقال</strong>
          <small>آن‌جا که اندیشه‌ها به سخن می‌آیند</small>
        </span>
      </a>
      <nav class="app-nav" aria-label="ناوبری اصلی">
        <a href="/projects" {% if request.url.path == '/projects' %}aria-current="page"{% endif %}>گفتارهای من</a>
        <a href="/projects/new" {% if request.url.path == '/projects/new' %}aria-current="page"{% endif %}>گفتار تازه</a>
        <a class="operator-only" href="/system-check" {% if request.url.path == '/system-check' %}aria-current="page"{% endif %}>آمادگی اجرا</a>
      </nav>
      <div class="app-header__tools">
        <span class="mode-flag operator-only">حالت پیشرفته</span>
        <div class="segmented-control" role="group" aria-label="حالت نمایش">
          <button type="button" data-mode-value="simple" aria-pressed="{{ 'true' if ui_mode != 'operator' else 'false' }}">ساده</button>
          <button type="button" data-mode-value="operator" aria-pressed="{{ 'true' if ui_mode == 'operator' else 'false' }}">پیشرفته</button>
        </div>
        <details class="theme-switcher">
          <summary>تم رنگی</summary>
          <div class="theme-switcher__panel" role="group" aria-label="انتخاب تم رنگی">
            <button class="theme-option" type="button" data-theme-value="cobalt" aria-pressed="{{ 'true' if ui_theme == 'cobalt' else 'false' }}"><span class="theme-option__swatch" aria-hidden="true"></span>آبی</button>
            <button class="theme-option" type="button" data-theme-value="wood" aria-pressed="{{ 'true' if ui_theme == 'wood' else 'false' }}"><span class="theme-option__swatch" aria-hidden="true"></span>قهوه‌ای</button>
            <button class="theme-option" type="button" data-theme-value="olive" aria-pressed="{{ 'true' if ui_theme == 'olive' else 'false' }}"><span class="theme-option__swatch" aria-hidden="true"></span>زیتونی</button>
            <button class="theme-option" type="button" data-theme-value="slate" aria-pressed="{{ 'true' if ui_theme == 'slate' else 'false' }}"><span class="theme-option__swatch" aria-hidden="true"></span>خاکستری</button>
          </div>
        </details>
        <form class="logout-form" method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="logout-button" type="submit">خروج</button>
        </form>
      </div>
    </div>
  </header>
  {% endif %}

  <main id="main" class="{% block main_class %}shell page{% endblock %}">
    {% if project is defined and project %}
      {% include "projects/_workflow_navigation.html" %}
    {% endif %}
    <div class="{% block content_class %}page-content{% endblock %}">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
